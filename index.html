<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>デジタル乗車券</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    background-color: #e2f0fc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #ffffff;
    width: 360px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    overflow: hidden;
    margin: 16px;
  }
  .header {
    background-color: #ff9800;
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 16px;
    font-weight: bold;
  }
  .content {
    padding: 20px;
  }
  .ticket-title {
    color: #e65100;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
  }
  
  /* くるくる（ローディングドット）のスタイル */
  .spinner-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 25px 0;
  }
  .dots-circle {
    position: relative;
    width: 90px;
    height: 90px;
  }
  .dot-node {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    margin-left: -7px;
    border-radius: 50%;
    /* 1周目：塗りつぶし（茶色）、2周目：クリア（白・非表示） */
    animation: fill-clear-cycle 3s infinite ease-in-out;
  }

  /* 8個のドットを円状（45度ずつ）に配置 */
  .dot-node:nth-child(1) { transform: rotate(0deg) translate(36px); animation-delay: 0s; }
  .dot-node:nth-child(2) { transform: rotate(45deg) translate(36px); animation-delay: 0.1875s; }
  .dot-node:nth-child(3) { transform: rotate(90deg) translate(36px); animation-delay: 0.375s; }
  .dot-node:nth-child(4) { transform: rotate(135deg) translate(36px); animation-delay: 0.5625s; }
  .dot-node:nth-child(5) { transform: rotate(180deg) translate(36px); animation-delay: 0.75s; }
  .dot-node:nth-child(6) { transform: rotate(225deg) translate(36px); animation-delay: 0.9375s; }
  .dot-node:nth-child(7) { transform: rotate(270deg) translate(36px); animation-delay: 1.125s; }
  .dot-node:nth-child(8) { transform: rotate(315deg) translate(36px); animation-delay: 1.3125s; }

  /* 右回りに茶色に塗りつぶされ、2周目で消えていくアニメーション */
  @keyframes fill-clear-cycle {
    0% {
      background-color: transparent;
      border: 2px solid #8d6e63;
    }
    /* 1周目：順に茶色で塗りつぶされる */
    12.5%, 50% {
      background-color: #6d4c41;
      border: 2px solid #6d4c41;
    }
    /* 2周目：順に消えて（元に戻って）いく */
    62.5%, 100% {
      background-color: transparent;
      border: 2px solid #8d6e63;
    }
  }

  .status-badge {
    background-color: #2e7d32;
    color: white;
    text-align: center;
    padding: 8px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .info-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }
  .info-table th, .info-table td {
    padding: 10px 4px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .info-table th {
    text-align: left;
    color: #666;
    width: 35%;
  }
  .info-table td {
    text-align: right;
    font-weight: bold;
    color: #333;
  }
  .time-display {
    text-align: center;
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    color: #d32f2f;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">デジタル乗車券</div>
  <div class="content">
    <div class="ticket-title">バス1日乗車券</div>
    
    <!-- 修正したくるくる（アニメーション） -->
    <div class="spinner-container">
      <div class="dots-circle">
        <div class="dot-node"></div>
        <div class="dot-node"></div>
        <div class="dot-node"></div>
        <div class="dot-node"></div>
        <div class="dot-node"></div>
        <div class="dot-node"></div>
        <div class="dot-node"></div>
        <div class="dot-node"></div>
      </div>
    </div>

    <div class="status-badge">● 利用可能（有効）</div>

    <table class="info-table">
      <tr>
        <th>利用日</th>
        <td id="current-date">----/--/--</td>
      </tr>
      <tr>
        <th>券種</th>
        <td>大人 1枚</td>
      </tr>
      <tr>
        <th>発行番号</th>
        <td>TK-849204</td>
      </tr>
    </table>

    <div class="time-display" id="current-time">00:00:00</div>
  </div>
</div>

<script>
  // 現在の日時と時刻を更新する処理
  function updateDateTime() {
    const now = new Date();
    
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    document.getElementById('current-date').textContent = `${year}/${month}/${day}`;
    
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;
  }

  setInterval(updateDateTime, 1000);
  updateDateTime();
</script>

</body>
</html>
